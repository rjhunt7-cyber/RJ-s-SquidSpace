<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RJ's Splice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Bebas+Neue&family=Permanent+Marker&family=Pacifico&family=Lobster&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#e7eef7; --panel:#ffffff; --panel2:#f1f6fc; --line:#cad8ea; --ink:#10233f; --ink2:#4d6585;
  --red:#d7263d; --focus:#1f5fa8; --track:#dde7f3; --ruler:#f6f9fd;
  --stage:#081629; --stage-ink:#d6e2f1; --stage-line:rgba(214,226,241,.14);
  --c-video:#2c69b0; --c-image:#3a7d99; --c-audio:#1d8475; --c-text:#b9801a; --c-sticker:#a84a86; --c-effect:#6a4fbf;
  --head:128px;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark; --bg:#06111f; --panel:#0c1e35; --panel2:#102745; --line:#1d3a60; --ink:#e8f0fa; --ink2:#8ea6c5;
    --red:#ee3d54; --focus:#8cc0ff; --track:#091a2e; --ruler:#0c1e35;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:13px/1.45 "IBM Plex Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  display:grid;grid-template-rows:52px minmax(0,1fr) 44px minmax(170px,34%);overflow:hidden}
html{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;letter-spacing:-.015em;white-space:nowrap}
.brand svg{width:30px;height:30px}
.proj{border:1px solid transparent;background:transparent;padding:5px 8px;border-radius:6px;font-weight:500;width:min(240px,30vw);color:var(--ink2)}
.proj:hover,.proj:focus{border-color:var(--line);background:var(--panel2);color:var(--ink)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:6px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.38;cursor:default}
.btn.icon{padding:6px 7px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);border-color:var(--red)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.work{display:grid;grid-template-columns:300px minmax(0,1fr) 300px;min-height:0}
.left{display:grid;grid-template-columns:66px minmax(0,1fr);background:var(--panel);border-right:1px solid var(--line);min-height:0}
.rail{display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--panel2);border-right:1px solid var(--line)}
.rail button{position:relative;border:0;background:none;border-radius:8px;padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2);cursor:pointer}
.rail button svg{width:19px;height:19px}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected=true]{background:var(--panel);color:var(--ink);box-shadow:inset 3px 0 0 var(--red)}
.badge{position:absolute;top:4px;right:6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;padding:0 4px;line-height:17px}
#leftPane{overflow:auto;padding:14px;min-height:0}
.ph2{font:800 18px "Bricolage Grotesque",sans-serif;margin:0 0 4px;letter-spacing:-.01em}
.hint{color:var(--ink2);margin:0 0 12px;font-size:12px}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{position:relative;border-radius:8px;cursor:grab;user-select:none}
.mthumb{aspect-ratio:16/10;border-radius:8px;background:var(--panel2) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);position:relative;overflow:hidden}
.mthumb.aud{background:linear-gradient(135deg,var(--c-audio),#0f4f47);color:#fff}
.mthumb .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.65);color:#fff;font-size:10px;border-radius:4px;padding:1px 5px;font-variant-numeric:tabular-nums}
.mname{font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.madd{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s}
.mcard:hover .madd,.madd:focus-visible{opacity:1}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcard{border:1px solid var(--line);background:#132a48;border-radius:8px;height:64px;cursor:pointer;display:grid;place-items:center;overflow:hidden;padding:4px}
.tcard span{font-size:17px;line-height:1.1;padding:2px 6px;border-radius:4px}
.egrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.egrid button{font-size:26px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;aspect-ratio:1;cursor:pointer;padding:0}
.egrid button:hover,.tcard:hover,.fxcard:hover{border-color:var(--ink2)}
.fxlist{display:grid;gap:6px}
.fxcard{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:7px;cursor:pointer;text-align:left}
.fxcard i{width:38px;height:38px;border-radius:6px;display:block}
.fxcard b{display:block;font-weight:600}
.fxcard small{color:var(--ink2)}
.scard{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.scard img,.scard .noimg{width:72px;height:46px;object-fit:cover;border-radius:6px;background:var(--panel2);display:block}
.scard b{display:block;font-weight:600;word-break:break-word}
.scard .meta{color:var(--ink2);font-size:12px}
.scard .acts{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.scard .acts .btn{padding:4px 6px;font-size:12px}
.emptybox{border:1.5px dashed var(--line);border-radius:10px;padding:16px;color:var(--ink2)}
.emptybox b{color:var(--ink);display:block;margin-bottom:4px}
.center{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--stage)}
.stagewrap{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:16px}
.stagebox{position:relative;box-shadow:0 0 0 1px var(--stage-line),0 18px 50px rgba(0,0,0,.45)}
#stage,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--stage-ink);pointer-events:none;padding:20px}
.empty .e1{font:800 clamp(18px,2.4vw,28px)/1.15 "Bricolage Grotesque",sans-serif;margin:0 0 6px;color:#fff}
.empty .e2{margin:0;opacity:.75}
.stagewrap.drop .stagebox{box-shadow:0 0 0 3px var(--red)}
.transport{display:flex;align-items:center;gap:6px;padding:7px 12px;color:var(--stage-ink);border-top:1px solid var(--stage-line)}
.transport .btn{background:transparent;border-color:var(--stage-line);color:var(--stage-ink)}
.transport .btn:hover{border-color:var(--stage-ink)}
.transport .play{background:var(--red);border-color:var(--red);color:#fff;padding:7px 12px}
.transport select{background:transparent;border:1px solid var(--stage-line);color:var(--stage-ink);border-radius:7px;padding:5px 6px}
.transport select option{color:#10233f}
.tc{font-variant-numeric:tabular-nums;font-size:13px;margin-left:8px;white-space:nowrap}
.tc b{color:#fff;font-weight:600}
.right{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:0;padding:6px 6px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap;overflow-x:auto;min-height:41px;align-items:flex-end}
.tab{border:0;background:none;padding:7px 5px 8px;font-size:12.5px;white-space:nowrap;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;font-weight:500}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
.insp-title{font:800 16px "Bricolage Grotesque",sans-serif;padding:0 4px 9px}
.pane{overflow:auto;padding:14px;flex:1;min-height:0}
.grp{margin-bottom:18px}
.grp h3{font:600 13px "IBM Plex Sans",sans-serif;margin:0 0 6px}
.grp p.note{color:var(--ink2);font-size:12px;margin:4px 0 8px}
.f{display:grid;grid-template-columns:82px minmax(0,1fr) 44px;align-items:center;gap:8px;margin:7px 0}
.f > span{color:var(--ink2);font-size:12px}
.f output{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12px}
.f.wide{grid-template-columns:82px minmax(0,1fr)}
input[type=range]{accent-color:var(--red);width:100%;margin:0}
input[type=color]{width:100%;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px}
select,input[type=text],input[type=number],textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
textarea{resize:vertical;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
.chk input{accent-color:var(--red);width:15px;height:15px}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.fcard{border:1px solid var(--line);background:none;border-radius:7px;padding:3px;cursor:pointer;font-size:11px;text-align:center}
.fcard img,.fcard .sw{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px;display:block;margin-bottom:3px;background:linear-gradient(135deg,#3a7d99,#d7263d 60%,#ffd166)}
.fcard.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12px;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.toolbar .btn{padding:5px 8px;border-color:transparent;background:transparent}
.toolbar .btn:hover:not(:disabled){border-color:var(--line);background:var(--panel2)}
.toolbar .btn.on{background:var(--ink);color:var(--panel)}
.toolbar .btn.keepbtn{background:var(--red);color:#fff;font-weight:600;border-color:var(--red);margin-left:6px}
.toolbar .lbl{font-size:12px}
.sep{width:1px;height:22px;background:var(--line);margin:0 5px;flex:none}
.toolbar .zoom{width:120px;flex:none}
.tl{position:relative;background:var(--panel2);min-height:0;overflow:auto;user-select:none;-webkit-user-select:none}
.tl-inner{position:relative;min-width:100%;min-height:100%}
.row{display:flex;border-bottom:1px solid var(--line)}
.rhead{position:sticky;left:0;z-index:6;width:var(--head);flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 6px 0 10px;font-size:12px;color:var(--ink2)}
.rhead .tname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead button{border:0;background:none;padding:4px;border-radius:5px;cursor:pointer;color:var(--ink2);display:grid}
.rhead button:hover{background:var(--panel2);color:var(--ink)}
.rhead button.off{color:var(--red)}
.lane{position:relative;flex:none;background:var(--track)}
.row.ruler{position:sticky;top:0;z-index:9;height:28px;border-bottom:1px solid var(--line)}
.row.ruler .rhead{z-index:11;font-variant-numeric:tabular-nums;color:var(--ink)}
.row.ruler .lane{background:var(--ruler);cursor:pointer}
#rulerCv{position:absolute;top:0;height:28px}
.row.trk{height:48px}
.row.trk.main{height:64px}
.row.trk.k-audio{height:44px}
.row.trk.main .rhead .tname{color:var(--ink);font-weight:600}
.row.dz{height:16px;border-bottom:0}
.row.dz .lane{background:transparent}
.row.dz .rhead{background:transparent;border-right-color:transparent}
.row.hot .lane{background:repeating-linear-gradient(90deg,transparent 0 8px,rgba(215,38,61,.18) 8px 16px)}
.row.trk.hot .lane{box-shadow:inset 0 0 0 1.5px var(--red)}
.lane-hint{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:12px;pointer-events:none;white-space:nowrap}
.clip{position:absolute;top:3px;bottom:3px;cursor:grab;color:#fff;border-radius:6px}
.clip-body{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:var(--c-video);border:1px solid rgba(0,0,0,.28)}
.k-image .clip-body{background:var(--c-image)}
.k-audio .clip-body{background:var(--c-audio)}
.k-text .clip-body{background:var(--c-text)}
.k-sticker .clip-body{background:var(--c-sticker)}
.k-effect .clip-body{background:var(--c-effect)}
.strip{position:absolute;top:0;bottom:0;left:0}
.strip canvas{position:absolute;top:0;height:100%}
.clip-name{position:absolute;left:8px;top:3px;font-size:11px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.85);white-space:nowrap;pointer-events:none;max-width:calc(100% - 12px);overflow:hidden;text-overflow:ellipsis}
.clip-tag{position:absolute;left:8px;bottom:3px;font-size:10px;font-weight:600;background:rgba(0,0,0,.45);border-radius:3px;padding:0 4px;pointer-events:none}
.kfd{position:absolute;bottom:4px;width:8px;height:8px;margin-left:-4px;background:#fff;border:1px solid #10233f;transform:rotate(45deg);pointer-events:none}
.clip .h{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.h-l{left:0;border-radius:6px 0 0 6px}.h-r{right:0;border-radius:0 6px 6px 0}
.clip.sel{z-index:4}
.clip.sel .clip-body{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--panel2)}
.clip.sel .h{background:var(--ink)}
.clip.sel .h::after{content:'';position:absolute;left:3px;top:35%;bottom:35%;width:3px;border-left:1px solid var(--panel);border-right:1px solid var(--panel)}
.keep{position:absolute;right:14px;top:50%;transform:translateY(-50%);z-index:3;display:inline-flex;align-items:center;gap:5px;border:0;background:var(--red);color:#fff;font-weight:600;font-size:12px;border-radius:999px;padding:5px 11px 5px 9px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.35);white-space:nowrap}
.keep:hover{filter:brightness(1.1)}
.keep.mini{right:auto;left:50%;transform:translate(-50%,-50%);padding:6px;gap:0}
.keep.mini span{display:none}
.keep svg{width:14px;height:14px}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--red);z-index:10;pointer-events:none}
.playhead::before{content:'';position:absolute;top:0;left:-6px;width:14px;height:14px;background:var(--red);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}
.snapline{position:absolute;top:0;bottom:0;width:1px;background:#ffd166;z-index:9;pointer-events:none}
body.dragging,body.dragging *{cursor:grabbing!important}
body.tool-blade .clip,body.tool-blade .clip *{cursor:crosshair}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none}
#pool video{width:2px;height:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:.18s;z-index:90;max-width:min(520px,90vw);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ctxmenu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px;min-width:230px;box-shadow:0 12px 34px rgba(0,0,0,.28)}
.ctxmenu button{display:flex;justify-content:space-between;gap:14px;width:100%;border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;text-align:left}
.ctxmenu button:hover{background:var(--panel2)}
.ctxmenu button.hl{color:var(--red);font-weight:600}
.ctxmenu kbd{font:inherit;color:var(--ink2);font-size:12px}
.ctxmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.modal-bg{position:fixed;inset:0;background:rgba(4,12,24,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal.wide{width:min(680px,100%)}
.modal h2{font:800 23px/1.15 "Bricolage Grotesque",sans-serif;margin:0 0 4px;letter-spacing:-.015em}
.modal .sub{color:var(--ink2);margin:0 0 14px}
.modal fieldset{border:0;padding:0;margin:12px 0}
.modal legend{font-weight:600;margin-bottom:4px;padding:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer}
.opt input{accent-color:var(--red);margin-top:3px}
.opt b{display:block;font-weight:600}
.opt small{color:var(--ink2);font-size:12px}
.opt:has(input:checked){border-color:var(--red);background:var(--panel2)}
fieldset:disabled .opt{opacity:.45;cursor:default}
.fld{display:block;margin:10px 0}
.fld > span{display:block;font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.linkbtn{border:0;background:none;color:var(--focus);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px;margin-right:auto}
.note{color:var(--ink2);font-size:12px}
.kbdlist{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:10px 0}
.kbdlist kbd{font:600 12px "IBM Plex Sans",sans-serif;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;white-space:nowrap;justify-self:start}
.prog{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:min(420px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.4)}
.prog-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.prog-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-top span{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--red);width:0}
.prog-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--ink2);font-size:12px;gap:10px}
body.exporting .left,body.exporting .right,body.exporting .toolbar,body.exporting .tl,body.exporting .top,body.exporting .transport{pointer-events:none;opacity:.55}
body.exporting #ov{pointer-events:none}
.vprev{width:100%;max-height:60vh;background:#000;border-radius:8px;display:block}

.roomy{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:95;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;width:min(340px,92vw);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.roomy b{display:block;font:800 18px "Bricolage Grotesque",sans-serif;margin-bottom:4px}.roomy span{display:block;color:var(--ink2);margin-bottom:12px}.roomy .row-btns{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">

/* ============ tracks ============ */
function addTrack(kind,index){const t={id:uid(),kind};if(index==null)index=kind==='audio'?S.tracks.length:0;S.tracks.splice(clamp(index,0,S.tracks.length),0,t);return t;}
function findFreeTrack(c,opt={}){
  const kind=kindOfTrack(c),near=opt.near||null;
  let list=S.tracks.filter(t=>t.kind===kind);
  if(near){const ni=S.tracks.indexOf(near);list.sort((a,b)=>Math.abs(S.tracks.indexOf(a)-ni)-Math.abs(S.tracks.indexOf(b)-ni));}
  for(const t of list){if(opt.avoidMain&&t.main)continue;if(!overlaps(c,t.id))return t;}
  if(kind==='audio')return addTrack('audio',near?S.tracks.indexOf(near)+1:S.tracks.length);
  return addTrack('visual',near?S.tracks.indexOf(near):0);
}
function pruneTracks(){
  S.tracks=S.tracks.filter(t=>t.main||S.clips.some(c=>c.track===t.id));
  if(!S.tracks.some(t=>t.kind==='audio'))S.tracks.push({id:uid(),kind:'audio'});
  // keep audio below visuals
  S.tracks.sort((a,b)=>(a.kind==='audio')-(b.kind==='audio'));
}

/* ============ history ============ */
const H={stack:[],redo:[]};
const snap=()=>JSON.stringify({tracks:S.tracks,clips:S.clips});
function commit(){H.stack.push(snap());if(H.stack.length>150)H.stack.shift();H.redo=[];}
function restore(j){const o=JSON.parse(j);S.tracks=o.tracks;S.clips=o.clips;if(!getClip(S.sel))S.sel=null;gcEls();refresh();}
function undo(){if(!H.stack.length)return toast('Nothing to undo.');H.redo.push(snap());restore(H.stack.pop());}
function redo(){if(!H.redo.length)return toast('Nothing to redo.');H.stack.push(snap());restore(H.redo.pop());}

/* ============ media import ============ */

async function importFiles(files){

    if(!type){toast(`“${f.name}” isn't a video, photo or sound file.`);continue;}
    const m=await addMedia(f,type,f.name.replace(/\.[^.]+$/,''));

/* ============ clip elements & playback ============ */
const EL=new Map();

  $('#pool').appendChild(v);

  if(AC){try{const s=AC.createMediaElementSource(v);e.gain=AC.createGain();s.connect(e.gain);e.gain.connect(master);}catch(err){}}

}
function dropEl(id){const e=EL.get(id);if(!e)return;try{e.el.pause();e.el.removeAttribute('src');e.el.load();e.el.remove();e.gain&&e.gain.disconnect();}catch(err){}EL.delete(id);}

let RENDER={};
const included=c=>!RENDER.solo||RENDER.solo.has(c.id);
function frameInfo(t){
  const layers=[],held=new Map();
  for(const tr of S.tracks){
    if(tr.kind!=='visual')continue;
    let cur=null,prev=null;
    if(!tr.hidden){
      for(const c of S.clips){if(c.track===tr.id&&included(c)&&clipActive(c,t)){cur=c;break;}}
      if(cur&&cur.kind!=='effect'&&cur.trans&&cur.trans.type!=='none'&&t-cur.start<cur.trans.dur){
        prev=S.clips.find(o=>o.id!==cur.id&&o.track===tr.id&&included(o)&&o.kind!=='effect'&&Math.abs(clipEnd(o)-cur.start)<.05)||null;
        if(prev)held.set(prev.id,clipEnd(prev)-.03);

    }
    layers.push({tr,cur,prev});
  }

}
function syncMedia(info){
  const t=S.time,P=S.playing;
  for(const c of S.clips){
    const e=elFor(c);if(!e)continue;const v=e.el,m=mediaOf(c),tr=trackById(c.track);
    const active=included(c)&&clipActive(c,t);
    if(active){
      const target=Math.min(srcTime(c,t),m.duration-.02);
      setVol(e,(c.muted||(tr&&tr.muted))?0:c.volume*fadeEnv(c,t-c.start));
      const rate=clamp(c.speed,.0625,16);if(v.playbackRate!==rate)v.playbackRate=rate;
      if(P){
        if(v.paused){if(Math.abs(v.currentTime-target)>.08)v.currentTime=target;const p=v.play();p&&p.catch(()=>{});}
        else if(Math.abs(v.currentTime-target)>.35)v.currentTime=target;
      }else{if(!v.paused)v.pause();if(!v.seeking&&Math.abs(v.currentTime-target)>.02)v.currentTime=target;}
    }else{
      if(!v.paused)v.pause();setVol(e,0);
      const h=info.held.get(c.id);let want=null;
      if(h!=null)want=Math.min(srcTime(c,h),m.duration-.03);
      else if(c.start>t&&c.start-t<1.5)want=c.in;
      if(want!=null&&!v.seeking&&Math.abs(v.currentTime-want)>.05)v.currentTime=want;
    }

}

/* ============ drawing ============ */

const TF=['x','y','scale','rot','opacity'];

  const k=c.kf;const pick=o=>({x:o.x,y:o.y,scale:o.scale,rot:o.rot,opacity:o.opacity});
  if(!k||!k.length)return pick(c);

  let i=0;while(i<k.length-1&&k[i+1].t<=l)i++;

  if(!k){k={...transformAt(c,l),t:l};c.kf.push(k);c.kf.sort((a,b)=>a.t-b.t);}k[p]=v;

    case 'zoomOut':r.s*=1+.7*q;r.a*=e;break;
    case 'slideL':r.dx-=q*1.05;break;
    case 'slideR':r.dx+=q*1.05;break;
    case 'slideU':r.dy-=q*1.05;break;
    case 'slideD':r.dy+=q*1.05;break;
    case 'pop':{const x=clamp(p,0,1)-1,k=1.9;r.s*=Math.max(.01,1+(k+1)*x*x*x+k*x*x);r.a*=clamp(p*4,0,1);break;}

function srcOf(c){const m=mediaOf(c);if(!m||!m.ready)return null;if(m.type==='image')return m.img;const e=elFor(c);if(e&&e.el.readyState>=2&&!e.el.seeking)return e.el;

function rr(g,x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h);}

  if(ce){
    e.preventDefault();const c=getClip(ce.dataset.cid);if(!c)return;
    if(S.tool==='blade'){let t=timeAt(e.clientX);if(Math.abs((t-S.time)*S.pps)<6)t=S.time;commit();const b=splitAt(c,t);if(!b){H.stack.pop();toast('That spot is too close to the edge of the clip.');return;}S.sel=b.id;afterEdit();splitTip();return;}
    const side=e.target.classList.contains('h-l')?'l':e.target.classList.contains('h-r')?'r':null;
    if(S.sel!==c.id)select(c.id);

});
tl.addEventListener('scroll',drawRuler);
tl.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(S.pps*(e.deltaY<0?1.15:1/1.15),e.clientX);}},{passive:false});
tl.addEventListener('contextmenu',e=>{const ce=e.target.closest('.clip');if(!ce)return;e.preventDefault();if(S.sel!==ce.dataset.cid)select(ce.dataset.cid);showCtx(e.clientX,e.clientY,getClip(ce.dataset.cid));});

tl.addEventListener('drop',e=>{

function setZoom(pps,anchorX){
  const old=S.pps;S.pps=clamp(pps,4,500);const r=tl.getBoundingClientRect();

  $('#zoom').value=Math.round(Math.log(S.pps/4)/Math.log(125)*100);
}

/* ============ editing commands ============ */
function splitAt(c,t){
  if(t<=c.start+.04||t>=clipEnd(c)-.04)return null;
  const l=t-c.start,mid=transformAt(c,l),b=JSON.parse(JSON.stringify(c));
  b.id=uid();b.start=t;b.dur=clipEnd(c)-t;b.in=c.in+l*c.speed;c.dur=l;
  if(c.kf.length){b.kf=c.kf.filter(k=>k.t>l+1e-3).map(k=>({...k,t:k.t-l}));b.kf.unshift({...mid,t:0});c.kf=c.kf.filter(k=>k.t<l-1e-3);c.kf.push({...mid,t:l});}
  c.animOut='none';c.fadeOut=0;b.animIn='none';b.fadeIn=0;b.trans={type:'none',dur:.6};
  S.clips.push(b);return b;
}
function splitTip(){if(S.tipSplit)return;S.tipSplit=true;toast('Cut. Click any piece, then press Save clip to keep just that piece.');}
function cmdSplit(){
  const t=S.time,s=selClip();let targets=s&&clipActive(s,t)?[s]:S.clips.filter(c=>clipActive(c,t));
  if(!targets.length)return toast('Move the playhead over a clip to split it.');
  commit();let made=0;for(const c of targets)if(splitAt(c,t))made++;
  if(!made){H.stack.pop();return toast('The playhead is too close to the edge of the clip.');}
  afterEdit();splitTip();
}
function cmdDelete(ripple){
  const c=selClip();if(!c)return;commit();S.clips=S.clips.filter(x=>x!==c);
  if(ripple)for(const o of S.clips)if(o.track===c.track&&o.start>=clipEnd(c)-1e-3)o.start-=c.dur;
  S.sel=null;afterEdit();
}
function cmdDuplicate(){
  const c=selClip();if(!c)return;commit();const b=JSON.parse(JSON.stringify(c));b.id=uid();b.start=clipEnd(c);
  if(overlaps(b,b.track))b.track=findFreeTrack(b,{near:trackById(c.track)}).id;
  S.clips.push(b);S.sel=b.id;afterEdit();
}
function cmdSeparate(){
  const c=selClip();if(!c||c.kind!=='video')return toast('Select a video clip to move its sound onto its own track.');
  if(c.muted)return toast('This clip’s sound is already off. Turn it back on in the Sound tab.');
  commit();const a=newClip('audio',{mediaId:c.mediaId,name:c.name+' sound',start:c.start,in:c.in,dur:c.dur,speed:c.speed,volume:c.volume,fadeIn:c.fadeIn,fadeOut:c.fadeOut});
  const first=S.tracks.find(t=>t.kind==='audio');a.track=first.id;if(overlaps(a,a.track))a.track=findFreeTrack(a,{near:first}).id;
  c.muted=true;S.clips.push(a);afterEdit();toast('Sound moved to its own track.');
}
async function cmdFreeze(){
  const c=selClip();if(!c||c.kind!=='video')return toast('Select a video clip to freeze a frame.');
  if(!clipActive(c,S.time))return toast('Move the playhead over the clip first.');
  pause();const e=elFor(c),m=mediaOf(c);if(!e||e.el.readyState<2)return toast('The frame is still loading. Try again.');
  const can=document.createElement('canvas');can.width=m.w;can.height=m.h;can.getContext('2d').drawImage(e.el,0,0);
  const blob=await new Promise(r=>can.toBlob(r,'image/png'));const fm=await addMedia(blob,'image',m.name+' freeze');if(!fm)return;
  commit();const t=S.time;splitAt(c,t);
  for(const o of S.clips)if(o.track===c.track&&o.start>=t-1e-3)o.start+=3;
  const f=newClip('image',{mediaId:fm.id,name:fm.name,start:t,dur:3,track:c.track,x:c.x,y:c.y,scale:c.scale,rot:c.rot,opacity:c.opacity,flipH:c.flipH,flipV:c.flipV,fit:c.fit,adj:{...c.adj},filter:c.filter});
  S.clips.push(f);S.sel=f.id;afterEdit();toast('Added a 3 second freeze frame.');
}
function addMediaClip(m,t,trackId,newTop){
  commit();
  const kind=m.type==='audio'?'audio':m.type;
  const c=newClip(kind,{mediaId:m.id,name:m.name,dur:m.type==='image'?4:m.duration});
  let tr=newTop&&kind!=='audio'?addTrack('visual',0):trackById(trackId);
  if(!compatible(c,tr))tr=kind==='audio'?S.tracks.find(x=>x.kind==='audio'):mainTrack();
  if(t==null)t=kind==='audio'?S.time:S.clips.filter(o=>o.track===tr.id).reduce((a,o)=>Math.max(a,clipEnd(o)),0);
  c.start=t;c.track=tr.id;if(overlaps(c,tr.id))c.track=findFreeTrack(c,{near:tr}).id;
  S.clips.push(c);S.sel=c.id;afterEdit();
}
function addOverlay(kind,o){
  commit();const c=newClip(kind,Object.assign({start:S.time},o));c.track=findFreeTrack(c,{avoidMain:true}).id;
  S.clips.push(c);S.sel=c.id;if(kind==='text')S.itab='Text';afterEdit();
}
function setSpeed(c,sp){
  sp=clamp(+sp||1,.1,10);if(Math.abs(sp-c.speed)<1e-4)return;commit();
  const old=c.dur,nd=c.dur*c.speed/sp,delta=nd-old,end0=clipEnd(c);
  for(const o of S.clips)if(o!==c&&o.track===c.track&&o.start>=end0-1e-3)o.start+=delta;
  c.kf.forEach(k=>k.t*=nd/old);c.speed=sp;c.dur=nd;afterEdit();
}
function setDur(c,d){
  d=Math.max(.1,+d||.1);const next=Math.min(Infinity,...S.clips.filter(o=>o!==c&&o.track===c.track&&o.start>=clipEnd(c)-1e-3).map(o=>o.start));
  commit();c.dur=Math.min(d,next-c.start);c.kf=c.kf.filter(k=>k.t<=c.dur);afterEdit();
}
function runCmd(k){
  $('#ctx').hidden=true;const c=selClip();
  switch(k){
    case 'select':S.tool='select';updateToolbar();break;
    case 'blade':S.tool=S.tool==='blade'?'select':'blade';updateToolbar();if(S.tool==='blade')toast('Cut tool on. Click anywhere on a clip to cut it there. Press V to go back.');break;
    case 'split':cmdSplit();break;
    case 'del':cmdDelete(false);break;
    case 'ripple':cmdDelete(true);break;
    case 'dup':cmdDuplicate();break;
    case 'separate':cmdSeparate();break;
    case 'freeze':cmdFreeze();break;
    case 'save':c?openSave(c.id):toast('Select a clip to save it.');break;
    case 'pieces':c&&savePieces(c.track);break;
    case 'snap':S.snap=!S.snap;updateToolbar();break;
    case 'zoomin':setZoom(S.pps*1.3);break;
    case 'zoomout':setZoom(S.pps/1.3);break;
    case 'fit':setZoom((tl.clientWidth-HEAD-40)/Math.max(projectEnd(),5));tl.scrollLeft=0;drawRuler();break;
  }
}
$('#toolbar').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b&&!b.disabled)runCmd(b.dataset.cmd);});
$('#zoom').addEventListener('input',e=>setZoom(4*Math.pow(125,e.target.value/100)));
function showCtx(x,y,c){
  const m=$('#ctx'),n=S.clips.filter(o=>o.track===c.track&&o.kind!=='effect').length;

    c.kind==='video'&&['separate','Separate sound',''],c.kind==='video'&&['freeze','Freeze frame',''],'-',['del','Delete','Del'],['ripple','Delete and close the gap','Shift+Del']].filter(Boolean);
  m.innerHTML=items.map(i=>i==='-'?'<hr>':`<button data-cmd="${i[0]}" class="${i[3]?'hl':''}"><span>${esc(i[1])}</span><kbd>${i[2]}</kbd></button>`).join('');
  m.hidden=false;const r=m.getBoundingClientRect();m.style.left=Math.min(x,innerWidth-r.width-8)/RZ+'px';m.style.top=Math.min(y,innerHeight-r.height-8)/RZ+'px';
}
$('#ctx').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)runCmd(b.dataset.cmd);});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx'))$('#ctx').hidden=true;},true);

/* ============ preview interaction ============ */
const PV={guide:null};
function toCanvasPt(e){const r=ov.getBoundingClientRect();return{x:(e.clientX-r.left)*ov.width/r.width,y:(e.clientY-r.top)*ov.height/r.height};}
function inBox(b,p){const dx=p.x-b.cx,dy=p.y-b.cy,c=Math.cos(-b.rot),s=Math.sin(-b.rot),x=dx*c-dy*s,y=dx*s+dy*c;return Math.abs(x)<=b.w/2&&Math.abs(y)<=b.h/2;}
ov.addEventListener('pointerdown',e=>{
  if(RENDER.exporting||e.button!==0)return;const p=toCanvasPt(e);let mode=null;
  const sb=S.sel&&BOX.get(S.sel);
  if(sb){const c=Math.cos(sb.rot),s=Math.sin(sb.rot);for(const[x,y]of[[-1,-1],[1,-1],[1,1],[-1,1]]){const px=sb.cx+(x*sb.w/2)*c-(y*sb.h/2)*s,py=sb.cy+(x*sb.w/2)*s+(y*sb.h/2)*c;if(Math.hypot(p.x-px,p.y-py)<14*ovK){mode='scale';break;}}}
  if(!mode){const hit=lastInfo.layers.map(l=>l.cur).filter(c=>c&&BOX.has(c.id)).find(c=>inBox(BOX.get(c.id),p));
    if(!hit){if(S.sel)select(null);return;}if(S.sel!==hit.id)select(hit.id);mode='move';}
  const c=selClip(),b=BOX.get(c.id),tf0=transformAt(c,clamp(S.time-c.start,0,c.dur)),d0=Math.max(1,Math.hypot(p.x-b.cx,p.y-b.cy));let done=false;
  ov.setPointerCapture(e.pointerId);
  const mv=ev=>{
    const q=toCanvasPt(ev);if(!done){commit();done=true;}
    if(mode==='move'){let x=tf0.x+(q.x-p.x)/cv.width,y=tf0.y+(q.y-p.y)/cv.height;PV.guide={x:Math.abs(x)<.012,y:Math.abs(y)<.012};if(PV.guide.x)x=0;if(PV.guide.y)y=0;setProp(c,'x',x);setProp(c,'y',y);}
    else setProp(c,'scale',clamp(tf0.scale*Math.hypot(q.x-b.cx,q.y-b.cy)/d0,.05,10));
    refreshInputs();
  };
  const up=()=>{ov.removeEventListener('pointermove',mv);ov.removeEventListener('pointerup',up);PV.guide=null;if(done){renderTimeline();updateToolbar();}};
  ov.addEventListener('pointermove',mv);ov.addEventListener('pointerup',up);
});
ov.addEventListener('dblclick',()=>{const c=selClip();if(c&&c.kind==='text'){S.itab='Text';renderInspector();const ta=$('#inspBody textarea');ta&&ta.focus();}});

<script>

  },

};

const insp=$('#inspBody');
insp.addEventListener('input',e=>{
  const el=e.target,c=selClip();if(!c||!el.dataset.p)return;
  if(!editing){commit();editing=true;updateToolbar();}
  const v=el.type==='checkbox'?el.checked:(el.type==='range'||el.type==='number')?parseFloat(el.value):el.value;
  setVal(c,el.dataset.p,v);const o=el.parentElement.querySelector('output');if(o)o.textContent=fmtVal(v,el.dataset.fmt);
  if(el.dataset.p==='text.content'){const n=$(`.clip[data-cid="${c.id}"] .clip-name`);if(n)n.textContent=clipLabel(c);}
});
insp.addEventListener('change',e=>{
  const el=e.target,c=selClip();editing=false;
  if(el.id==='bgColor'){S.bgColor=el.value;return;}
  if(!c)return;
  if(el.dataset.actChange==='speed')return setSpeed(c,el.value);
  if(el.dataset.actChange==='dur')return setDur(c,el.value);
  if(el.dataset.p){renderTimeline();if(TF.includes(el.dataset.p)||el.dataset.p==='effect')renderInspector();}
});
insp.addEventListener('click',e=>{
  const c=selClip();
  const st=e.target.closest('[data-set]');
  if(st){const p=st.dataset.set,raw=st.dataset.v;
    if(p==='aspect'){S.aspect=raw;applyCanvasSize(...projectSize());renderInspector();syncAspectSelect();return;}
    if(p==='res'){S.res=+raw;applyCanvasSize(...projectSize());renderInspector();return;}
    if(p==='bg'){S.bg=raw;renderInspector();return;}
    if(!c)return;
    if(p==='speed')return setSpeed(c,+raw);
    commit();setVal(c,p,isNaN(+raw)?raw:+raw);renderInspector();renderTimeline();updateToolbar();return;}
  const f=e.target.closest('[data-filter]');if(f&&c){commit();c.filter=f.dataset.filter;renderInspector();renderTimeline();updateToolbar();return;}
  const a=e.target.closest('[data-act]');if(!a||!c)return;
  const l=clamp(S.time-c.start,0,c.dur);
  switch(a.dataset.act){
    case 'kf':{commit();const i=c.kf.findIndex(k=>Math.abs(k.t-l)<.04);if(i>=0)c.kf.splice(i,1);else{c.kf.push({...transformAt(c,l),t:l});c.kf.sort((x,y)=>x.t-y.t);}break;}
    case 'kfclear':commit();Object.assign(c,transformAt(c,l));c.kf=[];break;
    case 'resettf':commit();Object.assign(c,{x:0,y:0,scale:1,rot:0,opacity:1,kf:[]});break;
    case 'flipH':commit();c.flipH=!c.flipH;break;
    case 'flipV':commit();c.flipV=!c.flipV;break;
    case 'resetadj':commit();c.adj={bright:0,contrast:0,sat:0,hue:0,blur:0,sepia:0};break;
    case 'separate':return cmdSeparate();
  }
  renderInspector();renderTimeline();updateToolbar();
});

let VO=null;
async function toggleVoice(){
  if(VO){VO.rec.stop();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true}),rec=new MediaRecorder(st),ch=[],at=S.time;
    rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    rec.onstop=async()=>{st.getTracks().forEach(t=>t.stop());VO=null;pause();renderLeft();const m=await addMedia(new Blob(ch,{type:rec.mimeType}),'audio','Voice '+(S.media.filter(x=>x.name.startsWith('Voice')).length+1));if(m)addMediaClip(m,at,null);};
    VO={rec};rec.start();renderLeft();if(S.clips.length)play();toast('Recording your voice. Press Stop recording when you’re done.');
  }catch(err){toast('The microphone is blocked. Allow microphone access in your browser to record.');}
}

function modal(html,wide){closeModal();const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal${wide?' wide':''}" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(bg);

<div class="actions">${pieces>1?`<button class="linkbtn" id="svAll">Save all ${pieces} pieces on this track</button>`:''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="svGo">${ic('keep')}Save clip</button></div>`);

function origSize(m){let w=m.w,h=m.h;const k=Math.min(1,3840/Math.max(w,h));w=Math.round(w*k/2)*2;h=Math.round(h*k/2)*2;return[Math.max(2,w),Math.max(2,h)];}
function savePieces(trackId){

const JOBS=[];let jobBusy=false,jobTotal=0,jobDone=0,cancelAll=false;
function enqueue(list){JOBS.push(...list);jobTotal+=list.length;if(!jobBusy)nextJob();}
async function nextJob(){
  const job=JOBS.shift();
  if(!job||cancelAll){jobBusy=false;JOBS.length=0;const n=jobDone;jobTotal=0;jobDone=0;$('#prog').hidden=true;if(cancelAll){cancelAll=false;toast('Stopped saving.');}else if(n>1)toast(`Saved ${n} clips to My clips.`);return;}
  jobBusy=true;
  try{const blob=await recordRange(job);if(blob&&!cancelAll){await finishSave(job,blob);jobDone++;}}
  catch(err){toast('Saving stopped: '+err.message);JOBS.length=0;}
  nextJob();
}
function waitReady(){return new Promise(res=>{const t0=performance.now();const chk=()=>{const busy=[...EL.values()].some(e=>e.el.seeking||(e.el.readyState<2&&e.el.src));if(!busy||performance.now()-t0>2500)setTimeout(res,120);else setTimeout(chk,50);};setTimeout(chk,80);});}
async function recordRange(job){
  ensureAC();if(AC)try{await AC.resume();}catch(e){}
  pause();closeModal();
  RENDER={solo:job.solo,original:job.original,exporting:true,end:job.b,job};
  applyCanvasSize(...(job.size||projectSize()));
  document.body.classList.add('exporting');
  $('#prog').hidden=false;$('#progName').textContent=(job.full?'Exporting “':'Saving “')+job.name+'”'+(jobTotal>1?` (${jobDone+1} of ${jobTotal})`:'');$('#progBar').style.width='0';
  S.time=job.a;await waitReady();
  const vs=cv.captureStream(S.fps);let dest=null;
  if(AC){dest=AC.createMediaStreamDestination();master.connect(dest);try{master.disconnect(AC.destination);}catch(e){}}
  const tracks=[...vs.getVideoTracks(),...(dest?dest.stream.getAudioTracks():[])];
  const cleanup=()=>{tracks.forEach(t=>t.stop());if(dest){try{master.disconnect(dest);}catch(e){}master.connect(AC.destination);}RENDER={};S.playing=false;for(const e of EL.values())e.el.pause();
    applyCanvasSize(...projectSize());document.body.classList.remove('exporting');S.time=job.a;updatePlayBtn();};
  let rec;
  try{rec=new MediaRecorder(new MediaStream(tracks),{mimeType:job.mime,videoBitsPerSecond:Math.round(job.rate*1e6),audioBitsPerSecond:192000});}
  catch(err){cleanup();throw new Error(`this browser can't record ${job.ext.toUpperCase()}. Pick the other format.`);}
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  return new Promise(res=>{
    rec.onstop=()=>{const stopped=RENDER.cancelled;cleanup();res(stopped||!chunks.length?null:new Blob(chunks,{type:job.mime.split(';')[0]}));};
    RENDER.onEnd=()=>{RENDER.onEnd=null;S.playing=false;setTimeout(()=>{if(rec.state!=='inactive')rec.stop();},180);};
    RENDER.cancel=()=>{RENDER.cancelled=true;RENDER.onEnd&&RENDER.onEnd();};
    rec.start(250);S.playing=true;lastTs=0;updatePlayBtn();
  });
}
$('#progCancel').addEventListener('click',()=>{cancelAll=true;JOBS.length=0;RENDER.cancel&&RENDER.cancel();});
function thumbFromBlob(url){return new Promise(res=>{const v=document.createElement('video');v.muted=true;v.preload='auto';v.src=url;let done=false;const fin=d=>{if(done)return;done=true;v.removeAttribute('src');v.load();res(d);};
  v.onloadeddata=()=>{v.currentTime=Math.min(.2,(v.duration||1)/2);};v.onseeked=()=>{try{fin(makeThumb(v,v.videoWidth,v.videoHeight).toDataURL('image/jpeg',.75));}catch(e){fin(null);}};v.onerror=()=>fin(null);setTimeout(()=>fin(null),4000);});}
/* WebM files from MediaRecorder have no length written in them; add it so every player can seek */
async function fixWebmDuration(blob,sec){
  try{
    const head=new Uint8Array(await blob.slice(0,Math.min(blob.size,262144)).arrayBuffer());
    const find=(sig,from=0)=>{outer:for(let i=from;i<head.length-sig.length;i++){for(let j=0;j<sig.length;j++)if(head[i+j]!==sig[j])continue outer;return i;}return -1;};
    const vint=p=>{const b=head[p];let len=1,m=0x80;while(len<=8&&!(b&m)){len++;m>>=1;}let v=b&(m-1);for(let i=1;i<len;i++)v=v*256+head[p+i];return{len,v};};
    const ip=find([0x15,0x49,0xA9,0x66]);if(ip<0)return blob;
    const sz=vint(ip+4),cs=ip+4+sz.len,ce=cs+sz.v;if(ce>head.length)return blob;
    const info=head.slice(cs,ce);
    let scale=1e6;for(let i=0;i<info.length-3;i++)if(info[i]===0x2A&&info[i+1]===0xD7&&info[i+2]===0xB1){const q=vint(cs+i+3);let v=0;for(let k=0;k<q.v;k++)v=v*256+head[cs+i+3+q.len+k];scale=v||1e6;break;}
    for(let i=0;i<info.length-1;i++)if(info[i]===0x44&&info[i+1]===0x89)return blob;
    const dur=new Uint8Array(11);dur[0]=0x44;dur[1]=0x89;dur[2]=0x88;new DataView(dur.buffer).setFloat64(3,sec*1e9/scale);
    const n=info.length+dur.length,hdr=new Uint8Array(12);hdr.set([0x15,0x49,0xA9,0x66,0x01]);let x=n;for(let i=11;i>=5;i--){hdr[i]=x&255;x=Math.floor(x/256);}
    return new Blob([blob.slice(0,ip),hdr,info,dur,blob.slice(ce)],{type:blob.type});
  }catch(e){return blob;}
}
async function finishSave(job,blob){
  if(job.ext==='webm')blob=await fixWebmDuration(blob,job.b-job.a);
  const url=URL.createObjectURL(blob),item={id:uid(),name:job.name,blob,url,dur:job.b-job.a,ext:job.ext,size:blob.size,thumb:null};
  S.saved.unshift(item);item.thumb=await thumbFromBlob(url);
  if(job.download)download(url,job.name+'.'+job.ext);
  S.ltab='clips';renderLeft();if(!job.batch)toast(job.full?`Exported “${job.name}”.`:`Saved “${job.name}” to My clips.`);
}

/* ============ keyboard ============ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();$('#ctx').hidden=true;if(S.tool==='blade'){S.tool='select';updateToolbar();}return;}
  if(e.target.matches('input,textarea,select')||RENDER.exporting||$('.modal-bg'))return;
  const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
  if(k===' '){e.preventDefault();togglePlay();}
  else if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(mod&&k==='y'){e.preventDefault();redo();}
  else if(mod&&k==='d'){e.preventDefault();cmdDuplicate();}
  else if(mod&&k==='s'){e.preventDefault();runCmd('save');}
  else if(mod&&k==='e'){e.preventDefault();openExport();}
  else if(mod)return;
  else if(k==='s')cmdSplit();
  else if(k==='b')runCmd('blade');
  else if(k==='v'){S.tool='select';updateToolbar();}
  else if(k==='delete'||k==='backspace'){e.preventDefault();cmdDelete(e.shiftKey);}
  else if(k==='arrowleft'){e.preventDefault();pause();seek(S.time-(e.shiftKey?1:1/30));}
  else if(k==='arrowright'){e.preventDefault();pause();seek(S.time+(e.shiftKey?1:1/30));}
  else if(k==='home'){e.preventDefault();seek(0);}
  else if(k==='end'){e.preventDefault();seek(projectEnd());}
  else if(k==='='||k==='+')setZoom(S.pps*1.3);
  else if(k==='-')setZoom(S.pps/1.3);
});
function openHelp(){
  const rows=[['Space','Play or pause'],['S','Split at the playhead'],['B','Cut tool: click a clip to cut it'],['V','Select tool'],['Ctrl + S','Save the selected clip'],['Ctrl + E','Export the whole video'],['Delete','Delete the selected clip'],['Shift + Delete','Delete and close the gap'],['Ctrl + D','Duplicate'],['Ctrl + Z','Undo'],['Ctrl + Shift + Z','Redo'],['Left / Right','Step one frame (hold Shift for 1 second)'],['+ / -','Zoom the timeline'],['Ctrl + scroll','Zoom the timeline'],['Right-click a clip','More options']];
  modal(`<h2>Keyboard shortcuts</h2><div class="kbdlist">${rows.map(([a,b])=>`<kbd>${a}</kbd><span>${b}</span>`).join('')}</div><div class="actions"><button class="btn primary" data-close>Done</button></div>`);
}

/* ============ wiring & init ============ */
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bHelp').onclick=openHelp;$('#bExport').onclick=openExport;
$('#tPlay').onclick=togglePlay;$('#tStart').onclick=()=>seek(0);$('#tEnd').onclick=()=>seek(projectEnd());
$('#tPrev').onclick=()=>{pause();seek(S.time-1/30);};$('#tNext').onclick=()=>{pause();seek(S.time+1/30);};
$('#tFull').onclick=()=>{const b=$('#stageBox');document.fullscreenElement?document.exitFullscreen():b.requestFullscreen&&b.requestFullscreen();};
function syncAspectSelect(){$('#tAspect').value=S.aspect;}
$('#tAspect').innerHTML=Object.keys(ASPECTS).map(k=>`<option value="${k}">${ASPECT_NAMES[k]}</option>`).join('');
$('#tAspect').onchange=e=>{S.aspect=e.target.value;applyCanvasSize(...projectSize());if(!S.sel)renderInspector();};
['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();$('#stageWrap').classList.toggle('drop',ev==='dragover');if(ev==='drop')importFiles([...e.dataTransfer.files]);}}));
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#stageWrap').classList.remove('drop');});
document.addEventListener('fullscreenchange',()=>setTimeout(fitStage,50));
new ResizeObserver(()=>{fitStage();}).observe($('#stageWrap'));
new ResizeObserver(()=>{renderTimeline();}).observe(tl);
addEventListener('beforeunload',e=>{if(S.clips.length||S.saved.length){e.preventDefault();e.returnValue='';}});
$$('[data-ic]').forEach(el=>{el.outerHTML=ic(el.dataset.ic);});
if(document.fonts)FONTS.forEach(([f])=>{try{document.fonts.load(`40px ${f}`);}catch(e){}});
growHostFrame();fitApp();smallFrameNotice();applyCanvasSize(...projectSize());syncAspectSelect();$('#zoom').value=Math.round(Math.log(S.pps/4)/Math.log(125)*100);
renderLeft();refresh();requestAnimationFrame(loop);
</script>
