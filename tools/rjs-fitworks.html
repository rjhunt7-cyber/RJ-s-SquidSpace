<style>
:root{--blue:#1d4fd7;--navy:#0e2a6b;--sky:#eaf1ff;--sky2:#d9e6ff;--maroon:#7a1b3a;--maroon2:#a32a55;--rose:#f8e9ee;
 --ink:#14213d;--ink2:#4d5d7e;--ink3:#8995b3;--line:#e0e7f4;--bg:#f4f7fc;--card:#fff;--ok:#19935b;--warn:#d98200;
 --y:#ffd23f;--o:#ff9a1f;--r:#e5383b;--p:#7b2cbf;--none:#d6dfef;
 --disp:"Heros Cn","Arial Narrow",Impact,sans-serif;--ui:"Carlito","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--disp);letter-spacing:.2px;line-height:1.1}
h2{font-size:26px;color:var(--navy)}h3{font-size:19px;color:var(--navy)}
.muted{color:var(--ink2)}.small{font-size:14px}.tiny{font-size:12.5px;color:var(--ink3)}
/* shell */
#top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(14,42,107,.06)}
.topin{max-width:1220px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font:700 25px var(--disp);color:var(--navy);white-space:nowrap}
.brand svg{width:38px;height:38px}
.brand b{color:var(--maroon);font-weight:700}
#nav{display:flex;gap:4px;flex:1;overflow-x:auto}
#nav button{border:0;background:none;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px;white-space:nowrap}
#nav button svg{width:20px;height:20px}
#nav button:hover{background:var(--sky)}
#nav button.on{background:var(--navy);color:#fff}
.who{font-size:14px;color:var(--ink2);text-align:right;white-space:nowrap}
main{max-width:1220px;margin:0 auto;padding:22px 20px 90px}
.grid{display:grid;gap:18px}.grid>*,.stack>*{min-width:0}
.g2{grid-template-columns:1.1fr .9fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 26px rgba(14,42,107,.06)}
.card.flat{box-shadow:none}
.card h3{margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:12px}
/* buttons + fields */
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;font-weight:700;color:var(--navy)}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.mar{background:var(--maroon);border-color:var(--maroon);color:#fff}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:transparent;background:var(--sky)}
.btn:disabled{opacity:.5;pointer-events:none}
.field{display:block}
.field>span{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:6px 12px}
textarea{height:auto}
input:focus,select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px #d6e3ff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px 8px;font-weight:700;color:var(--ink2)}
.seg button.on{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-weight:700;font-size:14.5px;color:var(--ink2)}
.chip.on{background:var(--sky2);border-color:var(--blue);color:var(--navy)}
.chip.mar.on{background:var(--rose);border-color:var(--maroon);color:var(--maroon)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--sky);color:var(--navy);white-space:nowrap}
.badge.m{background:var(--rose);color:var(--maroon)}.badge.g{background:#e3f6ec;color:#12724a}.badge.w{background:#fff1d6;color:#9a5a00}
.tabs2{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
/* hero + ring */
.hero{background:linear-gradient(120deg,var(--navy),#1b43b8 65%,#2f5de0);color:#fff;border-radius:24px;padding:22px 24px;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(163,42,85,.55),transparent 65%)}
.hero h2{color:#fff}.hero .muted{color:#cfdcff}
.ringwrap{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.ring{position:relative;width:190px;height:190px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font:700 46px var(--disp);color:var(--navy);line-height:1}.ring .lbl{font-size:13.5px;color:var(--ink2)}
.bars{flex:1;min-width:230px}
.mbar{margin-bottom:11px}
.mbar .t{display:flex;justify-content:space-between;font-size:14.5px;font-weight:700;margin-bottom:4px}
.mbar .track{height:11px;border-radius:8px;background:var(--sky);overflow:hidden}
.mbar .fill{height:100%;border-radius:8px;background:var(--blue);transition:width .4s}
.mbar.p .fill{background:var(--maroon)}.mbar.c .fill{background:var(--blue)}.mbar.f .fill{background:#e0a21a}.mbar.fi .fill{background:var(--ok)}
.mbar.over .fill{background:var(--r)}
.stat{background:var(--sky);border-radius:16px;padding:14px 16px}
.stat .n{font:700 30px var(--disp);color:var(--navy);line-height:1.05}.stat .l{font-size:13.5px;color:var(--ink2)}
/* diary */
.meal{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.meal:first-child{border:0;margin:0;padding:0}
.entry{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--bg);margin-top:8px}
.entry .nm{font-weight:700;color:var(--ink);flex:1;min-width:0}
.entry .nm small{display:block;font-weight:400;color:var(--ink2)}
.entry .kc{font:700 18px var(--disp);color:var(--navy);white-space:nowrap}
.xbtn{border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}.xbtn:hover{background:#fff;color:var(--maroon)}
.insight{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--sky)}
.insight.warn{background:#fff3dc}.insight.good{background:#e5f6ed}.insight.mar{background:var(--rose)}
.insight .ic{font-size:22px;line-height:1.1}.insight b{display:block}
/* facts */
.facts{display:grid;gap:10px}
.fact{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}
.fact .h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--navy);margin-bottom:6px}
.fact ul{margin:0;padding-left:0;list-style:none}
.fact li{display:flex;gap:9px;margin:5px 0;font-size:15px}
.area{flex:none;min-width:62px;text-align:center;border-radius:8px;font-size:12px;font-weight:700;padding:2px 6px;height:fit-content;background:var(--sky);color:var(--navy)}
.area.Hair{background:#f3e6ff;color:#5e2a96}.area.Skin{background:#ffe9e0;color:#a24716}.area.Heart{background:#ffe3e6;color:#b01e35}.area.Brain{background:#e1f0ff;color:#16529a}
.area.Muscle{background:#ffe9c9;color:#8a4b00}.area.Energy{background:#fff3b8;color:#7a5c00}.area.Bones{background:#e8eef7;color:#38506f}.area.Gut{background:#e0f6e8;color:#12724a}
.area.Sleep{background:#e6e4ff;color:#3b349b}.area.Immune{background:#dff7f3;color:#0f6e63}.area.Eyes{background:#e0f4ff;color:#0b6a8c}.area.Blood{background:#ffe0e6;color:#9d1535}.area.Fullness{background:#eaf5d9;color:#4a6e12}
.area.Joints{background:#ece8f7;color:#47397d}.area.Mood{background:#ffeaf5;color:#962c70}.area.Fluids{background:#dff0ff;color:#16529a}
/* modal */
#modal-root{position:fixed;inset:0;z-index:80;display:none}
#modal-root.on{display:block}
.mback{position:absolute;inset:0;background:rgba(10,24,64,.5)}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;background:#fff;border-radius:22px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mbox.narrow{width:min(520px,calc(100vw - 24px))}
.mclose{position:absolute;right:14px;top:12px}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:12px;width:100%;border:0;background:none;text-align:left}
.res:hover{background:var(--sky)}
.res small{display:block;color:var(--ink2)}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:14px;z-index:99;display:none;font-weight:700;max-width:92vw;text-align:center}
/* body map */
.bodies{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.bodies figure{margin:0;text-align:center}.bodies figcaption{font-weight:700;color:var(--ink2);font-size:14px}
.body{width:min(188px,42vw);height:auto}
.body .base{fill:#e4ebf7;stroke:#b9c6df;stroke-width:1.2}
.body .m{stroke:#fff;stroke-width:1.5;cursor:pointer;transition:filter .15s,opacity .15s}
.body .m:hover,.body .m.sel{filter:brightness(1.1) drop-shadow(0 0 5px rgba(14,42,107,.5))}
.L-1{fill:var(--none)}.L0{fill:var(--y)}.L1{fill:var(--o)}.L2{fill:var(--r)}.L3{fill:var(--p)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.dot.L-1{background:var(--none)}.dot.L0{background:var(--y)}.dot.L1{background:var(--o)}.dot.L2{background:var(--r)}.dot.L3{background:var(--p)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;cursor:pointer}
.mrow:hover,.mrow.sel{background:var(--sky)}
.lvlname{font-weight:700;font-size:13.5px}
/* plan + charts */
.pday{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pday button{flex:none;min-width:84px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:8px 10px;text-align:center;font-weight:700;color:var(--ink2)}
.pday button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pday small{display:block;font-weight:400;opacity:.8}
.pmeal{display:grid;grid-template-columns:100px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.pmeal .slot{font:700 15px var(--disp);color:var(--maroon)}
svg.chart{width:100%;height:auto;display:block}
.chart text{font:12px var(--ui);fill:var(--ink2)}
.empty{padding:26px;text-align:center;color:var(--ink2);border:2px dashed var(--line);border-radius:18px}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.who{display:none}.pmeal{grid-template-columns:1fr}}
@media (max-width:760px){
  .topin{padding:8px 12px;gap:10px}.brand{font-size:21px}.brand svg{width:32px;height:32px}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-between;box-shadow:0 -6px 20px rgba(14,42,107,.1)}
  #nav button{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 7px;flex:1;justify-content:center}
  main{padding:14px 12px 100px}.f3{grid-template-columns:1fr 1fr}
  .ring{width:160px;height:160px}.ring .big{font-size:38px}
}
@media print{#top,#nav,#toast{display:none}}

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const dishOK=(d,p)=>{const bad=new Set();p.restrict.forEach(r=>(RESTRICT[r]?RESTRICT[r][1]:[]).forEach(x=>bad.add(x)));return !d.flags.some(x=>bad.has(x));};

function buildPlan(p,t,plan){
  const cus=p.cuisines&&p.cuisines.length?p.cuisines:['american'],pool=DISHES.filter(d=>dishOK(d,p)),days=[],used={},notes=new Set();

  const nSn=t.kcal<2400?1:t.kcal<3000?2:3,snTot=[0,.10,.20,.27][nSn],split={b:.28*(1-snTot),l:.36*(1-snTot),d:.36*(1-snTot)};
  const mainsHere=pool.filter(d=>d.meal==='m'&&cus.includes(d.cu)).length;
  const wide=mainsHere<8;
  if(wide)notes.add('Only '+mainsHere+' main dishes in your chosen food traditions fit your restrictions, so I mixed in ideas from other cuisines for variety. Add more cuisines in the settings above to widen the choice.');
  const cands=(slot,cuList)=>pool.filter(d=>d.meal===slot&&cuList.includes(d.cu));
  for(let di=0;di<7;di++){
    const rand=rng(plan.seed*7919+di*104729),meals=[];
    const slots=[['b','Breakfast','b'],['l','Lunch','m'],['d','Dinner','m'],['s','Snack','s']];
    for(let i=2;i<=nSn;i++)slots.push(['s'+i,'Snack','s']);
    for(const [sk,label,type] of slots){
      const rot=type==='m'?(di*2+(sk==='d'?1:0))%cus.length:(di+(sk.length>1?+sk[1]-1:0))%cus.length;
      let list=cands(type,[cus[rot]]).filter(d=>(used[d.id]||0)<2);
      if(list.length<2)list=cands(type,cus).filter(d=>(used[d.id]||0)<2);
      if(list.length<2&&(type==='m'||list.length===0))list=pool.filter(d=>d.meal===type&&(used[d.id]||0)<2);

      const swap=plan.swaps[di+sk]||0,pick=scored[swap%scored.length].d;used[pick.id]=(used[pick.id]||0)+1;
      const share=type==='s'?snTot/nSn:split[sk];

      const f=mainsK>0?(t.kcal-fixed)/mainsK:1;meals.filter(m=>m.slot[0]!=='s').forEach(m=>{m.scale=clamp(q10(m.scale*f),.5,2.5);});}};
    fit();
    for(let boost=0;boost<2&&planTotals(meals).p<t.protein*.92;boost++){const sn=meals.filter(m=>m.slot[0]==='s');if(!sn.length)break;sn.forEach(m=>{m.scale=clamp(q10(m.scale*1.5),.5,2);});fit();}
    let tot=planTotals(meals),gap=t.kcal-tot.kcal;
    if(gap>220){const sn=pool.filter(d=>d.meal==='s'&&!meals.some(m=>m.dish.id===d.id)).map(d=>({d,s:d.p/d.kcal+rand()*.02})).sort((a,b)=>b.s-a.s)[0];
      if(sn)meals.push({slot:'x',label:'Extra snack',dish:sn.d,scale:clamp(q10(gap/sn.d.kcal),.5,2.5),alts:1});}
    meals.sort((a,b)=>'bldssx'.indexOf(a.slot[0])-'bldssx'.indexOf(b.slot[0]));
    tot=planTotals(meals);days.push({meals,totals:tot});
  }

function planWhy(p,t){const g=t.goal,out=[];

  else if(g==='maintain')out.push('Calories match what you burn each day, so your weight should stay steady. Protein at '+t.protein+' g protects muscle.');

const EXMAP=Object.fromEntries(EXS.map(e=>[e.id,e]));
function ageFactor(a){return a<=14?.7:a<20?.7+(a-14)*.05:a<40?1:Math.max(.6,1-.007*(a-39));}
function stdFor(ex,p){
  const base=p.sex==='male'?ex.M:p.sex==='female'?ex.F:ex.M.map((v,i)=>(v+ex.F[i])/2);
  const ref=p.sex==='female'?62:p.sex==='male'?82:72,sf=clamp(Math.pow(p.weightKg/ref,-1/3),.75,1.3),af=ageFactor(p.age);

   +'<label class="row small"><input type="checkbox" id="pf-pop" data-in="pf" '+(p.popNotes?'checked':'')+' style="width:auto;height:auto"> Show general public-health notes for my background</label></div></div>'
   +(p.setup?'':'<button class="btn pri" data-act="finishsetup" style="padding:14px">Save and start tracking</button>')+'</div>'
   +'<div class="stack"><div class="card"><h3>Your numbers</h3><div class="grid g3"><div class="stat"><div class="n">'+t.kcal+'</div><div class="l">calories a day</div></div><div class="stat"><div class="n">'+t.protein+' g</div><div class="l">protein</div></div><div class="stat"><div class="n">'+t.carbs+' g</div><div class="l">carbs</div></div><div class="stat"><div class="n">'+t.fat+' g</div><div class="l">fat</div></div><div class="stat"><div class="n">'+t.fiber+' g</div><div class="l">fiber</div></div><div class="stat"><div class="n">'+t.water+'</div><div class="l">ml water</div></div></div>'
   +'<div class="stack small" style="margin-top:14px"><div class="row between"><span>Resting burn (BMR)</span><b>'+t.bmr+' cal</b></div><div class="row between"><span>Total daily burn (TDEE)</span><b>'+t.tdee+' cal</b></div><div class="row between"><span>Sleep target</span><b>'+t.sleep[0]+' to '+t.sleep[1]+' hours</b></div><div class="row between"><span>BMI</span><span class="badge '+(t.bmiCat[1]||'')+'">'+t.bmi+' &middot; '+esc(t.bmiCat[0])+'</span></div></div>'
   +t.notes.map(x=>'<div class="insight warn" style="margin-top:10px"><span class="ic">!</span><div>'+esc(x)+'</div></div>').join('')+'<p class="tiny" style="margin-bottom:0">Calories use the Mifflin-St Jeor equation. BMI is only a rough screen: it cannot tell muscle from fat. These are estimates, not medical advice.</p></div>'
   +'<div class="card"><h3>Weigh-ins</h3><div class="row wrap"><input type="number" id="w-new" step="0.1" placeholder="Weight ('+wUnit()+')" style="max-width:160px"><button class="btn pri" data-act="addw">Add today</button></div><div class="stack" style="margin-top:10px">'+(wl||'<p class="muted small" style="margin:0">Add a weigh-in to see your trend in Coach.</p>')+'</div></div>'
   +'<div class="card"><h3>Your data</h3>'+(hasStorage()?'<p class="small muted" style="margin-top:0">Your data saves automatically here.</p>':'<div class="insight warn" style="margin-bottom:10px"><span class="ic">!</span><div><b>Save a backup</b>This page keeps your data only while it is open. Download a backup now and then, and load it here next time.</div></div>')+'<div class="row wrap"><button class="btn pri" data-act="export">Download backup</button><label class="btn">Load a backup<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn" data-act="reset" style="color:var(--maroon)">Erase everything</button></div>'+(S.lastBackup?'<p class="tiny" style="margin-bottom:0">Last backup: '+new Date(S.lastBackup).toLocaleString()+'</p>':'')+'</div></div></div></div>';}
const VIEWS={today:viewToday,exercise:viewExercise,sleep:viewSleep,plan:viewPlan,insights:viewInsights,profile:viewProfile};
function render(){
  if(!S.profile||!S.profile.setup)UI.tab='profile';
  const y=window.scrollY;$('#nav').innerHTML=TABS.map(([k,n,ic])=>'<button class="'+(UI.tab===k?'on':'')+'" data-act="tab" data-tab="'+k+'"'+(!P().setup&&k!=='profile'?' disabled style="opacity:.45"':'')+'>'+svgi(ic)+'<span>'+n+'</span></button>').join('');
  $('#who').innerHTML=P().setup?esc(GOALS[P().goal])+'<br>'+targets().kcal+' cal goal':'';
  $('#view').innerHTML=VIEWS[UI.tab]();window.scrollTo(0,y);}

// ================= Actions and startup =================
const slim=f=>{const o={};['name','brand','cat','basis','kcal','p','c','f','fiber','sugar','sodium','sat','hasMicro','servG','servLabel','tags','fact','src','nutri','nova','barcode','ingredients','id'].forEach(k=>{if(f[k]!==undefined)o[k]=f[k];});o.tags=(f.tags||[]).slice();return o;};
const num=id=>{const el=$('#'+id);const v=el?parseFloat(el.value):NaN;return isNaN(v)?null:v;};
function ensureProfile(){if(!S.profile)S.profile=JSON.parse(JSON.stringify(DEF_PROFILE));return S.profile;}
function pushRecent(f){const s=slim(f);S.recents=[s,...S.recents.filter(x=>x.name!==s.name)].slice(0,12);}
function addToDiary(food,amt,meal,key){const d=day(key||UI.date);d.meals[meal].push({uid:uid(),food:slim(food),amt});pushRecent(food);save();}
function confirmModal(msg,yes){UI.confirmYes=yes;openModal('<h2>Are you sure?</h2><p>'+esc(msg)+'</p><div class="row wrap"><button class="btn mar" data-act="confirmyes">Yes, do it</button><button class="btn" data-act="mclose">Cancel</button></div>',true);}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
function readProfileForm(){const p=ensureProfile();const g=id=>$('#'+id);
  if(g('pf-name'))p.name=g('pf-name').value.trim().slice(0,30);
  if(g('pf-age')){const a=num('pf-age');if(a!=null)p.age=clamp(Math.round(a),10,100);}
  if(g('pf-w')){const w=num('pf-w');if(w!=null)p.weightKg=clamp(wToKg(w),30,300);}
  if(g('pf-hcm')){const h=num('pf-hcm');if(h!=null)p.heightCm=clamp(h,100,230);}
  if(g('pf-hft')){const ft=num('pf-hft')||0,inn=num('pf-hin')||0;p.heightCm=clamp((ft*12+inn)*INCH,100,230);}
  if(g('pf-goal'))p.goal=g('pf-goal').value;if(g('pf-act'))p.activity=g('pf-act').value;
  if(g('pf-bg')){const was=p.background;p.background=g('pf-bg').value;if(p.background!==was&&(p.cuisines.length===1&&p.cuisines[0]==='american'||!p.setup))p.cuisines=BG_CUISINES[p.background]||['american'];}
  if(g('pf-pop'))p.popNotes=g('pf-pop').checked;save();}
const ACTS={
  tab:el=>{UI.tab=el.dataset.tab;render();window.scrollTo(0,0);},
  dateprev:()=>{UI.date=addDays(UI.date,-1);render();},datenext:()=>{UI.date=addDays(UI.date,1);render();},datetoday:()=>{UI.date=dkey();render();},
  mclose:closeModal,confirmyes:()=>{const f=UI.confirmYes;closeModal();f&&f();},
  addfood:el=>openAddFood(el.dataset.meal),
  fatab:el=>{UI.fa.tab=el.dataset.t;UI.fa.sel=null;UI.fa.prefill=null;renderFA();},
  pick:el=>{const i=+el.dataset.i,f=UI.fa.res&&UI.fa.res[i];if(!f)return;UI.fa.sel=f;UI.fa.entry=null;UI.fa.amt=f.basis==='100g'?(f.servG||100):1;renderFA();},
  faback:()=>{if(UI.fa.entry){closeModal();return;}UI.fa.sel=null;renderFA();},
  addentry:()=>{const f=UI.fa.sel,meal=$('#fa-meal').value;if(!(UI.fa.amt>0)){toast('Enter an amount first.');return;}addToDiary(f,UI.fa.amt,meal);closeModal();render();toast('Added '+f.name+' to '+MEALS.find(m=>m[0]===meal)[1]+'.');},
  entry:el=>{const d=day(UI.date),e=d.meals[el.dataset.meal].find(x=>x.uid===el.dataset.uid);if(!e)return;UI.fa={meal:el.dataset.meal,tab:'search',sel:e.food,amt:e.amt,entry:{meal:el.dataset.meal,uid:e.uid},res:null,bc:null};renderFA();},
  saveentry:()=>{const en=UI.fa.entry,e=day(UI.date).meals[en.meal].find(x=>x.uid===en.uid);if(e&&UI.fa.amt>0)e.amt=UI.fa.amt;save();closeModal();render();},
  delentry:el=>{const d=day(UI.date);d.meals[el.dataset.meal]=d.meals[el.dataset.meal].filter(x=>x.uid!==el.dataset.uid);save();render();},
  bclookup:doBarcode,
  manualbc:()=>{const r=UI.fa.bc||{};UI.fa.tab='create';UI.fa.prefill={barcode:r.code||(($('#fa-bc')||{}).value||'')};renderFA();},
  fixbc:()=>{const f=(UI.fa.bc||{}).food;if(!f)return;const ps=perServing(f);UI.fa.tab='create';UI.fa.prefill={name:f.name,brand:f.brand,barcode:f.barcode,servLabel:f.servLabel,kcal:'',p:r1(ps.p),c:r1(ps.c),f:r1(ps.f),fiber:r1(ps.fiber),sugar:r1(ps.sugar),sodium:r0(ps.sodium)};renderFA();},
  createfood:()=>{const name=($('#cf-name').value||'').trim(),kcal=num('cf-kcal');if(!name){toast('Give the food a name.');return;}if(kcal==null||kcal<0){toast('Enter the calories for one serving.');return;}
    const v=id=>Math.max(0,num('cf-'+id)||0),bc=($('#cf-barcode').value||'').replace(/\D/g,'');
    const tags=[];if(v('p')>=10)tags.push('protein');if(v('fiber')>=3)tags.push('fiber');
    const f={id:'c'+uid(),name,brand:($('#cf-brand').value||'').trim(),cat:'My foods',basis:'serving',servLabel:($('#cf-serv').value||'').trim()||'1 serving',kcal,p:v('p'),c:v('c'),f:v('f'),fiber:v('fiber'),sugar:v('sugar'),sodium:v('sodium'),hasMicro:num('cf-sugar')!=null||num('cf-sodium')!=null,tags,fact:'',src:'custom',barcode:bc||undefined};
    S.custom=[f,...S.custom.filter(x=>x.name!==name)];if(bc&&/^\d{8,14}$/.test(bc))S.barcodes[bc]=f;save();UI.fa.sel=f;UI.fa.amt=1;UI.fa.entry=null;UI.fa.res=[f];renderFA();},
  muscle:el=>{UI.ex.muscle=el.dataset.m;render();},
  addex:()=>{const ex=EXMAP[$('#ex-sel').value],p=P(),reps=num('ex-r'),sets=Math.max(1,Math.round(num('ex-s')||1));let w=ex.type==='count'?0:num('ex-w');
    if(!(reps>0)){toast('Enter the reps'+(ex.type==='count'?' or seconds':'')+'.');return;}
    if(ex.type!=='count'&&ex.type!=='bw'&&!(w>0)){toast('Enter the weight you lifted.');return;}
    const rec={id:uid(),ex:ex.id,w:ex.type==='count'?0:wToKg(w||0),reps,sets};day(UI.date).ex.push(rec);save();
    const thr=stdFor(ex,p),m=metricOf(ex,rec,p),L=scoreLevel(tierScore(m,thr));UI.ex.sel=ex.id;render();
    toast(ex.name.replace(/ \(.*\)/,'')+': '+LEVELS[L][0]+' ('+LEVELS[L][1].toLowerCase()+')'+(ex.type==='bar'||ex.type==='db'?' - est. one-rep max '+fmtW(rec.w*(1+Math.min(reps,15)/30)):'')+'. Check the muscle map.',4200);},
  delex:el=>{const d=day(UI.date);d.ex=d.ex.filter(x=>x.id!==el.dataset.id);save();render();},
  addcardio:()=>{const min=num('c-min');if(!(min>0)){toast('Enter the minutes.');return;}const rec={id:uid(),type:$('#c-type').value,min,int:+$('#c-int').value};rec.kcal=cardioKcal(rec,P().weightKg);day(UI.date).cardio.push(rec);save();render();toast('Added about '+rec.kcal+' calories burned.');},
  delcardio:el=>{const d=day(UI.date);d.cardio=d.cardio.filter(x=>x.id!==el.dataset.id);save();render();},
  savesleep:()=>{const h=num('sl-h');if(!(h>0&&h<=16)){toast('Enter the hours you slept (up to 16).');return;}day(UI.date).sleep={h:r1(h),q:+$('#sl-q').value};save();render();toast('Sleep saved.');},
  delsleep:()=>{day(UI.date).sleep=null;save();render();},
  plday:el=>{UI.plan.day=+el.dataset.d;render();},
  plcu:el=>{const p=ensureProfile(),k=el.dataset.k;p.cuisines=p.cuisines.includes(k)?p.cuisines.filter(x=>x!==k):[...p.cuisines,k];if(!p.cuisines.length)p.cuisines=['american'];save();render();},
  plres:el=>{const p=ensureProfile(),k=el.dataset.k;p.restrict=p.restrict.includes(k)?p.restrict.filter(x=>x!==k):[...p.restrict,k];S.plan.swaps={};save();render();},
  plsuggest:()=>{const p=ensureProfile();p.cuisines=(BG_CUISINES[p.background]||['american']).slice();save();render();toast(p.background?'Picked cuisines from your background. Change them any time.':'Choose a background in your profile for suggestions.');},
  plnew:()=>{S.plan.seed++;S.plan.swaps={};save();render();},
  plswap:el=>{const i=+el.dataset.i,pl=buildPlan(P(),targets(),S.plan),m=pl.days[UI.plan.day].meals[i],k=UI.plan.day+m.slot;S.plan.swaps[k]=(S.plan.swaps[k]||0)+1;save();render();},
  plfacts:el=>{const m=buildPlan(P(),targets(),S.plan).days[UI.plan.day].meals[+el.dataset.i];openFacts(m.dish,m.scale);},
  pllog:el=>{const m=buildPlan(P(),targets(),S.plan).days[UI.plan.day].meals[+el.dataset.i],key=addDays(dkey(),UI.plan.day);addToDiary(m.dish,m.scale,SLOTMEAL[m.slot[0]],key);render();toast('Logged '+m.dish.name+'.');},
  pllogday:()=>{const pl=buildPlan(P(),targets(),S.plan),key=addDays(dkey(),UI.plan.day);pl.days[UI.plan.day].meals.forEach(m=>addToDiary(m.dish,m.scale,SLOTMEAL[m.slot[0]],key));render();toast('Logged the whole day.');},
  seg:el=>{const p=ensureProfile(),f=el.dataset.f,v=el.dataset.v;if(f==='units')readProfileForm();p[f]=v;save();render();},
  pfcu:el=>{const p=ensureProfile(),k=el.dataset.k;p.cuisines=p.cuisines.includes(k)?p.cuisines.filter(x=>x!==k):[...p.cuisines,k];if(!p.cuisines.length)p.cuisines=['american'];save();render();},
  pfres:el=>{const p=ensureProfile(),k=el.dataset.k;p.restrict=p.restrict.includes(k)?p.restrict.filter(x=>x!==k):[...p.restrict,k];save();render();},
  finishsetup:()=>{readProfileForm();const p=ensureProfile();p.setup=true;S.weights=S.weights.filter(x=>x.d!==dkey());S.weights.push({d:dkey(),kg:p.weightKg});save();UI.tab='today';render();window.scrollTo(0,0);toast('Welcome aboard! Your plan is ready.');},
  addw:()=>{const v=num('w-new');if(!(v>0)){toast('Enter your weight.');return;}const kg=clamp(wToKg(v),30,300);S.weights=S.weights.filter(x=>x.d!==dkey());S.weights.push({d:dkey(),kg});ensureProfile().weightKg=kg;save();render();toast('Weigh-in saved. Your targets updated.');},
  delw:el=>{S.weights=S.weights.filter(x=>x.d!==el.dataset.d);save();render();},
  export:()=>{S.lastBackup=Date.now();save();download('fitworks-backup-'+dkey()+'.json',JSON.stringify(S));render();toast('Backup downloaded.');},
  reset:()=>confirmModal('This erases your profile, food diary, workouts, sleep and weigh-ins. Download a backup first if you might want them.',()=>{S=freshState();save();UI.tab='profile';render();toast('All data erased.');})
};
const SLOTMEAL={b:'breakfast',l:'lunch',d:'dinner',s:'snacks',x:'snacks'};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')e.preventDefault();const fn=ACTS[el.dataset.act];if(fn)fn(el,e);});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='faq')updateSearch();
  else if(k==='amtG'){const v=parseFloat(t.value);UI.fa.amt=v>0?v:0;const s=$('#amtS');if(s&&UI.fa.sel.servG)s.value=r1(UI.fa.amt/UI.fa.sel.servG);updateDetail();}
  else if(k==='amtS'){const v=parseFloat(t.value),f=UI.fa.sel;UI.fa.amt=v>0?(f.basis==='100g'?v*(f.servG||100):v):0;const g=$('#amtG');if(g)g.value=r1(UI.fa.amt);updateDetail();}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.in;
  if(k==='exsel'){UI.ex.sel=t.value;render();}
  else if(k==='pf'){readProfileForm();render();}
  else if(t.id==='imp'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o!=='object'||!o.days)throw 0;loadState(o);save();UI.tab=S.profile&&S.profile.setup?'today':'profile';render();window.scrollTo(0,0);toast('Backup loaded.');}catch(x){toast('That file is not a FitWorks backup.');}};fr.readAsText(t.files[0]);t.value='';}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('svg [data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}if(e.key==='Escape'&&$('#modal-root').classList.contains('on'))closeModal();
  if(e.key==='Enter'&&e.target.id==='fa-bc'){e.preventDefault();doBarcode();}});
async function init(){
  const raw=await Store.get('fitworks:data');if(raw){try{loadState(JSON.parse(raw));}catch(e){}}
  if(S.profile&&S.profile.setup)UI.tab='today';render();
  window.FW={S:()=>S,UI,targets,buildPlan,muscleLevels,lookupBarcode,gs1Valid,insights,render,ACTS,DISHES,FOODS,parseOFF};}
init();

</script></body></html>
