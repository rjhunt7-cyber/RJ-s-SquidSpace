<style>
:root{--blue:#1f4fd1;--blue2:#e9efff;--blue3:#c9d8ff;--red:#e03b3b;--ink:#15203b;--ink2:#56627e;--ink3:#8d97b0;--line:#e2e7f1;--paste:#e6eaf3;--ui:"Carlito","Segoe UI",system-ui,sans-serif;--brand:"Adventor","Century Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font:14.5px/1.35 var(--ui);color:var(--ink);background:#fff;display:grid;grid-template-rows:54px 42px 1fr 30px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
#top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--blue) 0 70%,var(--red) 70% 100%)}
.brand{display:flex;align-items:center;gap:9px;font:700 21px var(--brand);color:var(--blue);white-space:nowrap;margin-right:6px}
.brand b{color:var(--red)}.brand svg{width:34px;height:34px}
.tb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;height:36px;padding:0 12px;font-weight:700;color:var(--ink)}
.tb:hover{border-color:var(--blue);color:var(--blue)}.tb.icon{width:36px;padding:0;justify-content:center}
.tb.pri{background:var(--blue);border-color:var(--blue);color:#fff}.tb.pri:hover{filter:brightness(1.1);color:#fff}
.tb:disabled{opacity:.4;pointer-events:none}
#docname{border:1px solid transparent;border-radius:8px;height:34px;padding:0 8px;font-weight:700;width:220px;background:transparent}
#docname:hover,#docname:focus{border-color:var(--line);outline:none;background:#fff}
.spacer{flex:1}
/* tool options strip */
#ctx{display:flex;align-items:center;gap:14px;padding:0 14px;background:#f7f9fd;border-bottom:1px solid var(--line);white-space:nowrap;overflow-x:auto;font-size:14px}
#ctx .tname{font:700 15px var(--brand);color:var(--blue)}#ctx .tip{color:var(--ink2)}
#ctx label{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
#ctx input[type=number]{width:64px;height:28px;border:1px solid var(--line);border-radius:7px;padding:0 6px;background:#fff}
#ctx .tb{height:28px;padding:0 10px;font-size:13.5px;border-radius:8px}
/* main */
#main{display:grid;grid-template-columns:1fr 300px;min-height:0}
#stage{position:relative;overflow:hidden;background:var(--paste);touch-action:none;outline:none}
#art,#ov{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#ted{position:absolute;display:none;border:1.5px dashed var(--blue);background:rgba(255,255,255,.75);resize:none;overflow:hidden;padding:0;margin:0;white-space:pre;outline:none;transform-origin:0 0;z-index:4;line-height:1.2;min-width:20px}
/* dock */
#dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px;box-shadow:0 10px 30px rgba(21,32,59,.18);z-index:5;max-width:calc(100% - 20px);overflow-x:auto}
#dock button{width:42px;height:42px;border:0;border-radius:13px;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
#dock button:hover{background:var(--blue2);color:var(--blue)}
#dock button.on{background:var(--blue);color:#fff}
#dock button.on::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--red)}
#dock .sep{width:1px;background:var(--line);margin:6px 3px;flex:none}
/* inspector */
#insp{border-left:1px solid var(--line);overflow-y:auto;background:#fff}
.sec{border-bottom:1px solid var(--line);padding:12px 14px}
.sec h4{margin:0 0 10px;font:700 15px var(--brand);color:var(--blue);display:flex;align-items:center;justify-content:space-between}
.sec h4 small{font:400 12.5px var(--ui);color:var(--ink3)}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.prow>span:first-child{width:52px;color:var(--ink2);font-size:13.5px;flex:none}
.prow input[type=number],.prow input[type=text],.prow select{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 7px;background:#fff;min-width:0;width:100%}
.prow input:focus,.prow select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 label,.grid3 label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}
.grid2 input{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 6px;width:100%;min-width:0}
.chipc{width:44px;height:30px;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;flex:none}
.chipc i{display:block;width:100%;height:100%;border-radius:5px}
.none-sw{background:linear-gradient(135deg,#fff 45%,var(--red) 45% 55%,#fff 55%)!important;border:1px solid var(--line)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.sb{border:1px solid var(--line);background:#fff;border-radius:9px;height:32px;min-width:32px;padding:0 9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--ink)}
.sb:hover{border-color:var(--blue);color:var(--blue)}.sb.on{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
.sb.wide{flex:1}.btnrow.tight{gap:4px;flex-wrap:nowrap}.btnrow.tight .sb{flex:1;padding:0 4px;font-size:12.5px;min-width:0}.sb.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.sb svg.ic{width:18px;height:18px}
.layers{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.lrow{display:flex;align-items:center;gap:4px;padding:3px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}
.lrow:last-child{border-bottom:0}.lrow:hover{background:#f6f8fd}.lrow.sel{background:var(--blue2)}
.lrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow button{border:0;background:none;width:24px;height:24px;border-radius:6px;color:var(--ink3);display:flex;align-items:center;justify-content:center;padding:0}
.lrow button.act{color:var(--blue)}.lrow button svg.ic{width:16px;height:16px}
.lrow.drop{box-shadow:inset 0 2px 0 var(--red)}
.hint{font-size:12.5px;color:var(--ink3);margin:4px 0 0}
/* status */
#status{display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2);background:#fff}
.zoom{display:flex;align-items:center;gap:6px}.zoom input[type=range]{width:130px;accent-color:var(--blue)}
.zoom button{border:1px solid var(--line);background:#fff;border-radius:7px;height:22px;min-width:22px;font-weight:700;font-size:12.5px;padding:0 6px}
.zoom button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#zpct{width:52px;text-align:right;font-weight:700;border:0;background:none}
/* popups */
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 44px rgba(21,32,59,.22);padding:6px;display:none;min-width:210px}
.pop.on{display:block}
.mi{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;border:0;background:none;padding:7px 10px;border-radius:9px;text-align:left}
.mi:hover{background:var(--blue2);color:var(--blue)}.mi kbd{font:12px var(--ui);color:var(--ink3)}
.msep{height:1px;background:var(--line);margin:5px 4px}
.swgrid{display:grid;grid-template-columns:repeat(8,24px);gap:5px;padding:6px}
.swgrid button{width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.12);padding:0}
.swgrid button:hover{transform:scale(1.15)}
#modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(15,25,55,.45)}
#modal.on{display:block}
.mbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:18px;padding:22px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 30px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mbox h2{margin:0 0 12px;font:700 23px var(--brand);color:var(--blue)}
.mbox .prow>span:first-child{width:110px}
.mbox table{border-collapse:collapse;width:100%;font-size:14px}.mbox td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.mbox kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;font:700 12.5px var(--ui);text-align:center;background:#f7f9fd}
#toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;z-index:90;display:none;font-weight:700;max-width:90vw;text-align:center}
#print{display:none}
@media (max-width:820px){#main{grid-template-columns:1fr}#insp{position:fixed;right:0;top:96px;bottom:30px;width:min(300px,88vw);z-index:30;transform:translateX(105%);transition:transform .2s;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
 body.panel #insp{transform:none}#docname{width:120px}.brand span{display:none}#bPanels{display:inline-flex!important}.zoom input[type=range]{width:80px}#stPos{display:none}}
@media print{body{display:block;height:auto;overflow:visible}body>*{display:none!important}#print{display:block!important}#print svg{display:block;width:100%;height:auto}}
</style></head><body>

 box:'Drag to draw. Shift for a square, Alt to draw from the center. A single click makes a 100 px box.',oval:'Drag to draw. Shift for a circle, Alt to draw from the center.',poly:'Drag to draw a regular polygon. Shift keeps it even.',
 star:'Drag to draw a star. Shift keeps it even.',line:'Drag to draw a straight line. Shift snaps to 45 degree steps.',type:'Click to place text, or click existing text to edit it. Click outside or press Esc when done.',
 dropper:'Click a shape to copy its fill and line onto the selection. With nothing selected it sets the paint for new shapes.',hand:'Drag to move around the page. Hold Space to do this with any tool.',zoom:'Click to zoom in, Alt-click to zoom out. Ctrl + scroll zooms too.'};
const SHAPES={box:'Box',oval:'Oval',poly:'Polygon',star:'Star'};
function evPt(e){const r=$('#stage').getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;return {sx,sy,x:sx/A.view.z+A.view.x,y:sy/A.view.z+A.view.y};}
const toS=(x,y)=>[(x-A.view.x)*A.view.z,(y-A.view.y)*A.view.z];
function findAny(id,list){for(const o of list||D.objs){if(o.id===id)return o;if(o.type==='group'){const r=findAny(id,o.kids);if(r)return r;}}return null;}
function replaceObj(o){const i=D.objs.findIndex(x=>x.id===o.id);if(i>=0)D.objs[i]=o;}
// ---- hit testing ----
function localBox(o){if(o.type==='image')return {x:0,y:0,w:o.w,h:o.h};const g=$('#content').querySelector('[data-id="'+o.id+'"] text');if(!g)return null;const b=g.getBBox();return {x:b.x,y:b.y,w:b.width,h:b.height};}
function hitDeep(o,x,y,tol){if(o.hidden)return false;if(o.type==='group')return o.kids.some(k=>hitDeep(k,x,y,tol));
  if(o.type==='path'){const p=$('#hitp');p.setAttribute('d',subsToD(o.subs));p.setAttribute('fill-rule',o.fr||'nonzero');const pt=new DOMPoint(x,y);

  const b=localBox(o);if(!b)return false;const [lx,ly]=M.ap(M.inv(o.m),x,y),t=tol/Math.sqrt(Math.abs(M.det(o.m))||1);return lx>=b.x-t&&lx<=b.x+b.w+t&&ly>=b.y-t&&ly<=b.y+b.h+t;}
function hitObj(x,y){const tol=4/A.view.z;for(let i=D.objs.length-1;i>=0;i--){const o=D.objs[i];if(!o.locked&&hitDeep(o,x,y,tol))return o;}return null;}
function handlePts(b){const x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.h,cx=(x0+x1)/2,cy=(y0+y1)/2;return [[x0,y0],[cx,y0],[x1,y0],[x1,cy],[x1,y1],[cx,y1],[x0,y1],[x0,cy]];}
const HCUR=['nwse','ns','nesw','ew','nwse','ns','nesw','ew'];
function hitHandle(sx,sy){if(A.tool!=='pick'||!A.sel.length)return null;const b=selBox();if(!b)return null;const hs=handlePts(b).map(p=>toS(...p));
  for(let i=0;i<8;i++)if(Math.abs(sx-hs[i][0])<=7&&Math.abs(sy-hs[i][1])<=7)return {type:'scale',i};
  const [X0,Y0]=toS(b.x,b.y),[X1,Y1]=toS(b.x+b.w,b.y+b.h);
  for(const i of [0,2,4,6]){const d=Math.hypot(sx-hs[i][0],sy-hs[i][1]);if(d>7&&d<28&&(sx<X0-2||sx>X1+2||sy<Y0-2||sy>Y1+2))return {type:'rot',i};}return null;}
function editPaths(){const out=[];for(const o of selObjs())walk(o,k=>{if(k.type==='path'&&!k.hidden)out.push(k);});return out;}
function hitNode(sx,sy){for(const o of editPaths())for(let si=0;si<o.subs.length;si++){const ns=o.subs[si].nodes;
    for(let ni=0;ni<ns.length;ni++){const n=ns[ni],key=o.id+':'+si+':'+ni;if(A.nsel.has(key)){for(const part of ['in','out']){const hx=part==='in'?n.ix:n.ox,hy=part==='in'?n.iy:n.oy;if(near(hx,n.x)&&near(hy,n.y))continue;const [x,y]=toS(hx,hy);if(Math.hypot(sx-x,sy-y)<7)return {o,si,ni,part};}}}
    for(let ni=0;ni<ns.length;ni++){const [x,y]=toS(ns[ni].x,ns[ni].y);if(Math.abs(sx-x)<7&&Math.abs(sy-y)<7)return {o,si,ni,part:'node'};}}return null;}
function hitSegment(sx,sy){const p=[(sx/A.view.z)+A.view.x,(sy/A.view.z)+A.view.y],tol=7/A.view.z;let best=null;
  for(const o of editPaths())o.subs.forEach((s,si)=>{const n=s.nodes,cnt=s.closed?n.length:n.length-1;for(let i=0;i<cnt;i++){const r=nearestOnSeg(segC(n[i],n[(i+1)%n.length]),p);if(r.d<tol&&(!best||r.d<best.d))best={o,si,i,t:r.t,d:r.d};}});return best;}
// ---- snapping ----
function snapCands(){const xs=[0,D.w/2,D.w],ys=[0,D.h/2,D.h];for(const o of D.objs){if(A.sel.includes(o.id)||o.hidden)continue;const b=bbox(o);if(!b)continue;xs.push(b.x,b.x+b.w/2,b.x+b.w);ys.push(b.y,b.y+b.h/2,b.y+b.h);}return {xs,ys};}
function snapMove(b,dx,dy,c){A.guides=[];if(!b)return [dx,dy];const tol=6/A.view.z;let sx=false,sy=false;
  if(A.opt.snap){const best=(vals,cands)=>{let bd=tol,r=null;for(const v of vals)for(const c of cands){const d=c-v;if(Math.abs(d)<bd){bd=Math.abs(d);r={d,at:c};}}return r;};
    const rx=best([b.x+dx,b.x+b.w/2+dx,b.x+b.w+dx],c.xs),ry=best([b.y+dy,b.y+b.h/2+dy,b.y+b.h+dy],c.ys);
    if(rx){dx+=rx.d;sx=true;A.guides.push({x:rx.at});}if(ry){dy+=ry.d;sy=true;A.guides.push({y:ry.at});}}
  if(A.opt.grid){const g=A.opt.gridSize;if(!sx)dx=Math.round((b.x+dx)/g)*g-b.x;if(!sy)dy=Math.round((b.y+dy)/g)*g-b.y;}return [dx,dy];}
function snapPoint(pt){if(A.opt.snap){const tol=6/A.view.z;for(const o of D.objs){if(o.hidden)continue;let hit=null;walk(o,k=>{if(hit||k.type!=='path')return;for(const s of k.subs)for(const n of s.nodes)if(Math.hypot(n.x-pt[0],n.y-pt[1])<tol){hit=[n.x,n.y];return;}});if(hit&&!(A.pen&&o.id===A.pen.id))return hit;}}

function c45(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),an=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);return [a[0]+L*Math.cos(an),a[1]+L*Math.sin(an)];}
const origMap=()=>{const m={};for(const o of selObjs())m[o.id]=clone(o);return m;};
function shapeSubs(t,x,y,w,h){if(t==='box')return rectSubs(x,y,w,h,A.opt.radius);const cx=x+w/2,cy=y+h/2;if(t==='oval')return ellipseSubs(cx,cy,w/2,h/2);
  if(t==='poly')return polySubs(cx,cy,Math.abs(w)/2,Math.abs(h)/2,clamp(Math.round(A.opt.sides),3,40));return starSubs(cx,cy,Math.abs(w)/2,Math.abs(h)/2,clamp(Math.round(A.opt.points),3,40),clamp(A.opt.inner,.05,.95));}

function onDown(e){if(e.button===2)return;closePops();if(A.editing&&e.target!==$('#ted'))commitText();

    D.objs.push(o);A.sel=[o.id];A.act={k:'shape',x0:pt[0],y0:pt[1],id:o.id,moved:false,t};renderDoc();afterSel(true);}
  else if(t==='type'){const o=hitObj(p.x,p.y);if(o&&o.type==='text'){A.sel=[o.id];afterSel();editText(o);return;}

    const targets=selObjs().filter(x=>x.id!==o.id);if(targets.length){targets.forEach(x=>walk(x,k=>{if(k.type!=='group')Object.assign(k,clone(paint));}));renderDoc();commit();toast('Paint copied onto the selection');}

function penDown(p,e){let pt=[p.x,p.y];const o=A.pen&&findAny(A.pen.id),s=o&&o.subs[0];

    const l=s.nodes[s.nodes.length-1];if(e.shiftKey)pt=c45([l.x,l.y],pt);else pt=snapPoint(pt);const n=nd(...pt);s.nodes.push(n);A.act={k:'pen',node:n,start:p};renderDoc();drawOverlay();return;}
  pt=snapPoint(pt);const st=stylePick(),n=mkPath([{closed:false,nodes:[nd(...pt)]}],'Path',Object.assign(st,{fill:null,stroke:st.stroke||'#13235a',sw:st.sw||2}));

function finishPen(){if(!A.pen)return;const o=findAny(A.pen.id);A.pen=null;if(o&&o.subs[0].nodes.length<2){D.objs=D.objs.filter(x=>x.id!==o.id);A.sel=[];}renderDoc();commit();drawOverlay();}
function onMove(e){const p=evPt(e),a=A.act;A.last=p;updatePos(p);
  if(!a){hoverAt(p);return;}
  if(a.k==='pan'){A.view.x=a.vx-(p.sx-a.sx)/A.view.z;A.view.y=a.vy-(p.sy-a.sy)/A.view.z;A.fitOn=false;applyView();return;}
  if(a.k==='move'){let dx=p.x-a.start.x,dy=p.y-a.start.y;if(!a.moved){if(Math.hypot(p.sx-a.start.sx,p.sy-a.start.sy)<3)return;a.moved=true;if(a.dup)dupForDrag(a);}
    if(e.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0;}[dx,dy]=snapMove(a.b,dx,dy,a.c);
    for(const id of A.sel){const o=clone(a.orig[id]);xform(o,M.tr(dx,dy));replaceObj(o);}a.dx=dx;a.dy=dy;renderDoc();drawOverlay();updateStatus();return;}
  if(a.k==='scale'){const b=a.b,hp=handlePts(b),i=a.h,anc=e.altKey?a.c:hp[(i+4)%8],hx=hp[i][0],hy=hp[i][1];let sx=1,sy=1;

    if(e.shiftKey||A.opt.lockAR){const s=i===1||i===5?Math.abs(sy):i===3||i===7?Math.abs(sx):Math.max(Math.abs(sx),Math.abs(sy));sx=Math.sign(sx||1)*s;sy=Math.sign(sy||1)*s;}
    sx=Math.abs(sx)<1e-3?1e-3:sx;sy=Math.abs(sy)<1e-3?1e-3:sy;const m=M.sc(sx,sy,anc[0],anc[1]);

  if(a.k==='rot'){let an=Math.atan2(p.y-a.c[1],p.x-a.c[0])-Math.atan2(a.start.y-a.c[1],a.start.x-a.c[0]);if(e.shiftKey)an=Math.round(an/(Math.PI/12))*(Math.PI/12);
    const m=M.rot(an,a.c[0],a.c[1]);for(const id of A.sel){const o=clone(a.orig[id]);xform(o,m);replaceObj(o);}a.moved=true;a.an=an;renderDoc();drawOverlay();$('#stSel').textContent='Turn '+Math.round(an*180/Math.PI)+'°';return;}

  if(a.k==='nmove'){let dx=p.x-a.start.x,dy=p.y-a.start.y;if(!a.moved&&Math.hypot(p.sx-a.start.sx,p.sy-a.start.sy)<2)return;a.moved=true;if(e.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0;}
    if(A.nsel.size===1){const k=[...A.nsel][0],o0=a.orig[k];if(o0){const sp=snapPointExcl([o0.x+dx,o0.y+dy],k);dx=sp[0]-o0.x;dy=sp[1]-o0.y;}}
    for(const k in a.orig){const [id,si,ni]=k.split(':'),o=findAny(id),n=o&&o.subs[si].nodes[ni],q=a.orig[k];if(!n)continue;n.x=q.x+dx;n.y=q.y+dy;n.ix=q.ix+dx;n.iy=q.iy+dy;n.ox=q.ox+dx;n.oy=q.oy+dy;}renderDoc();drawOverlay();return;}

function snapPointExcl(pt,key){const [id,si,ni]=key.split(':');if(A.opt.snap){const tol=6/A.view.z;for(const o of D.objs){if(o.hidden)continue;let hit=null;
    walk(o,k=>{if(hit||k.type!=='path')return;k.subs.forEach((s,sj)=>s.nodes.forEach((n,nj)=>{if(!hit&&!(k.id===id&&sj==si&&nj==ni)&&!A.nsel.has(k.id+':'+sj+':'+nj)&&Math.hypot(n.x-pt[0],n.y-pt[1])<tol)hit=[n.x,n.y];}));});if(hit)return hit;}}

function dupForDrag(a){const sorted=D.objs.filter(o=>A.sel.includes(o.id)),ids=[],orig={};let top=Math.max(...sorted.map(o=>D.objs.indexOf(o)));

function onUp(e){const a=A.act;A.act=null;A.guides=[];if(!a){return;}const st=$('#stage');try{st.releasePointerCapture(e.pointerId);}catch(x){}
